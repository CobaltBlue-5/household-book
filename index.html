<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>家計簿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="tabbar">
    <button class="tab" data-tab="home">ホーム</button>
    <button class="tab" data-tab="calendar">カレンダー</button>
    <button id="addBtn" data-act="add" aria-label="記録する">＋</button>
    <button class="tab" data-tab="report">レポート</button>
    <button class="tab" data-tab="settings">設定</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
<input type="file" id="artFile" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
